name: Bootstrap

# One-time setup: completes the repository from .bootstrap/, commits it and publishes v1.0.0.
# Runs only while .bootstrap/ exists; delete this file afterwards.
on:
  push:
    branches: [main]
    paths: [".bootstrap/**"]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy the extension source from another repository
        if: hashFiles('.bootstrap/source') != ''
        run: |
          read -r SRC_REPO SRC_BRANCH SRC_DIR < .bootstrap/source
          git clone --depth 1 --filter=blob:none --sparse -b "$SRC_BRANCH" "https://github.com/$SRC_REPO.git" /tmp/src
          git -C /tmp/src sparse-checkout set "$SRC_DIR"
          # Files already in this repository win; everything else comes from the source.
          cp -rn "/tmp/src/$SRC_DIR/." .

      - name: Append text to copied files
        run: |
          if [ -d .bootstrap/append ]; then
            cd .bootstrap/append
            find . -type f | while read -r f; do cat "$f" >> "../../${f#./}"; done
          fi

      - name: Decode binary files
        run: |
          if [ -d .bootstrap/b64 ]; then
            cd .bootstrap/b64
            find . -type f -name '*.b64' | while read -r f; do
              target="../../${f#./}"; target="${target%.b64}"
              case "$target" in
                *.gz) target="${target%.gz}"; mkdir -p "$(dirname "$target")"; base64 -d "$f" | gunzip > "$target" ;;
                *) mkdir -p "$(dirname "$target")"; base64 -d "$f" > "$target" ;;
              esac
              # Refuse to continue if the decoded file does not match its checksum.
              sum="${f%.b64}"; sum="${sum%.gz}.sha256"
              if [ -f "$sum" ]; then echo "$(cat "$sum")  $target" | sha256sum -c -; fi
            done
          fi

      - name: Apply changes on top of the copied source
        if: hashFiles('.bootstrap/patch.js') != ''
        run: node .bootstrap/patch.js

      - name: Create the lockfile if it is missing
        run: '[ -f package-lock.json ] || npm install --package-lock-only --ignore-scripts --no-audit --no-fund'

      - name: Check the extension
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write package.json
          npx ray build -e dist -o build --non-interactive
          npx eslint src

      - name: Commit the completed repository
        run: |
          rm -rf .bootstrap build node_modules raycast-env.d.ts
          chmod +x scripts/install.command
          git config user.name "jnbp"
          git config user.email "50960701+jnbp@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          git update-index --chmod=+x scripts/install.command
          git commit -m "Complete repository: assets, lockfile and source"
          git push origin HEAD:main
          git tag v1.0.0
          git push origin v1.0.0

      - name: Publish release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="$(sed -n 's/^NAME="\(.*\)"$/\1/p' scripts/install.command)"
          TITLE="$(sed -n 's/^TITLE="\(.*\)"$/\1/p' scripts/install.command)"
          mkdir -p dist
          cp scripts/install.command "dist/install-$NAME.command"
          chmod +x "dist/install-$NAME.command"
          (cd dist && zip -q "install-$NAME.zip" "install-$NAME.command")
          gh release create v1.0.0 --title "$TITLE v1.0.0" --generate-notes \
            "dist/install-$NAME.zip" "dist/install-$NAME.command"
